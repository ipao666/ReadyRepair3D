[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readyrepair3d"
version = "0.1.0"
description = "Quality-first Chinese prompt to textured GLB research pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.2.6",
  "pillow==12.3.0",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "trimesh==4.12.2",
]

[project.optional-dependencies]
vision = [
  "diffusers==0.39.0",
  "opencv-python-headless==5.0.0.93",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.57.3",
]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU and model weights",
  "blender: requires Blender or bpy",
  "integration: requires external repositories, models, or services",
]
