name: CPU tests and evidence
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: python -m pip install -r requirements-cpu.txt
      - run: python tools/check_cpu.py
